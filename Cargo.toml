[package]
name = "pixly_kernel"
version = "0.1.0"
edition = "2024"
authors = ["Pixly Team"]
description = "AI-driven media format converter with intelligent optimization"
readme = "README.md"
homepage = "https://github.com/yourusername/pixly"
repository = "https://github.com/yourusername/pixly"
license = "MIT"
keywords = ["image", "video", "converter", "ai", "optimization"]
categories = ["multimedia", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }  # 🚀 启用rc特性优化
serde_json = "1.0"
image = { version = "0.25", features = ["jpeg", "png", "webp", "gif"] }
imageproc = "0.25"
tracing = "0.1"
thiserror = "1.0"
num_cpus = "1.16"
fast_image_resize = "4.0"
rayon = "1.10"
log = "0.4"
once_cell = "1.19"
which = "6.0"
regex = { version = "1.10", default-features = false, features = ["std", "perf", "unicode-perl"] }  # 🚀 启用性能优化 + Unicode支持
md5 = "0.7"
blake3 = { version = "1.5", features = ["rayon"] }  # 🚀 启用并行哈希
hex = "0.4"
infer = "0.16"
sysinfo = "0.30"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
filetime = "0.2"  # 文件时间戳保留
flate2 = "1.0"    # 🔥 Phase 3: 缓存压缩功能

# 平台特定的扩展属性支持
[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.3"  # macOS 扩展属性

[target.'cfg(target_os = "linux")'.dependencies]
xattr = "1.3"  # Linux 扩展属性

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.0", features = ["full"] }
criterion = { version = "0.5", features = ["html_reports"] }  # 🚀 性能基准测试

[[bench]]
name = "conversion_benchmark"
harness = false

[lints.rust]
unused_imports = "deny"
unused_variables = "deny"
dead_code = "warn"

# 🚀 Phase 3: 性能优化配置（参考rimage）
[profile.release]
opt-level = 3              # 最高优化级别
lto = true                 # 完整LTO（比thin更激进）
codegen-units = 1          # 单个代码生成单元，最大化优化
strip = true               # 移除调试符号，减小二进制大小
panic = "abort"            # panic时直接abort，减小二进制大小
overflow-checks = false    # release模式禁用溢出检查

[profile.dev]
opt-level = 1              # dev模式也启用基础优化，加快开发迭代

# 🎯 Phase 3: Cargo Features 系统
[features]
default = [
    "image-base",
    "video-base",
    "ai-core",
    "parallel",
]

# 图像编码器特性
image-base = []
image-modern = ["image-base"]
image-all = ["image-modern"]

# 视频编码器特性
video-base = []  # H.264, H.265通过ffmpeg
video-modern = ["video-base"]  # AV1, VP9
video-experimental = ["video-modern"]  # H.266/VVC

# AI功能特性
ai-core = []
ai-advanced = ["ai-core"]

# 性能优化特性
simd = []  # SIMD加速
parallel = ["rayon", "blake3/rayon"]  # 并行处理
gpu = []  # GPU加速

[[bin]]
name = "pixly-kernel"
path = "pixly_kernel_cli.rs"

[[bin]]
name = "pixly-kernel-video"
path = "pixly_kernel_video_cli.rs"

[[bin]]
name = "pixly-converter"
path = "pixly_converter_cli.rs"
