[package]
name = "pixly_kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", features = ["jpeg", "png", "webp", "gif"] }
imageproc = "0.25"
tracing = "0.1"
thiserror = "1.0"
num_cpus = "1.16"
fast_image_resize = "4.0"
rayon = "1.10"
log = "0.4"
which = "6.0"
regex = "1.10"
md5 = "0.7"
blake3 = "1.5"
hex = "0.4"
infer = "0.16"
sysinfo = "0.30"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.0", features = ["full"] }

[lints.rust]
unused_imports = "deny"
unused_variables = "deny"
dead_code = "warn"

[[bin]]
name = "pixly-kernel"
path = "pixly_kernel_cli.rs"

[[bin]]
name = "pixly-kernel-video"
path = "pixly_kernel_video_cli.rs"

[[bin]]
name = "pixly-converter"
path = "pixly_converter_cli.rs"
