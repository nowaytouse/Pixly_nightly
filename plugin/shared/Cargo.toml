[package]
name = "pixly-eagle-core"
version = "3.0.0"
edition = "2024"
authors = ["Pixly Team"]
description = "Pixly Eagle Plugin Core - Unified Media Conversion Engine"
license = "MIT"

[dependencies]
# 主库依赖，启用所有插件功能
pixly_kernel = { path = "../..", features = ["plugin-format-vue", "plugin-ai-vue"] }

# CLI 框架
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"

[[bin]]
name = "pixly-eagle-core"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
