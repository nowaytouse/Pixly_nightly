<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 圆角矩形背景 - 渐变绿青色 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0fff4;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-opacity="0.3"/>
    </filter>
    
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)"/>
  
  <!-- 中心图片框 -->
  <g transform="translate(106, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="300" height="220" rx="25" fill="url(#iconGradient)" opacity="0.95"/>
    
    <!-- 图片内容 - 山峰风景 -->
    <path d="M 20 140 L 60 80 L 100 110 L 150 50 L 200 90 L 240 60 L 280 110 L 280 180 L 20 180 Z" 
          fill="#11998e" opacity="0.4"/>
    <path d="M 20 160 L 80 100 L 140 130 L 200 80 L 260 120 L 280 100 L 280 180 L 20 180 Z" 
          fill="#38ef7d" opacity="0.5"/>
    
    <!-- 太阳 -->
    <circle cx="60" cy="60" r="25" fill="#ffd700" opacity="0.8"/>
    <circle cx="60" cy="60" r="30" fill="#ffd700" opacity="0.3"/>
  </g>
  
  <!-- 大眼睛 (观看) -->
  <g transform="translate(156, 200)" filter="url(#glow)">
    <!-- 眼睛轮廓 -->
    <ellipse cx="100" cy="50" rx="100" ry="45" fill="none" stroke="white" stroke-width="8" opacity="0.9"/>
    <!-- 虹膜 -->
    <circle cx="100" cy="50" r="28" fill="white" opacity="0.95"/>
    <!-- 瞳孔 -->
    <circle cx="100" cy="50" r="15" fill="#11998e"/>
    <!-- 高光 -->
    <circle cx="108" cy="42" r="6" fill="white" opacity="0.9"/>
  </g>
  
  <!-- 播放按钮 (动画) -->
  <g transform="translate(330, 280)" filter="url(#shadow)">
    <circle cx="30" cy="30" r="35" fill="#ff6ec7" opacity="0.95"/>
    <circle cx="30" cy="30" r="35" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
    <!-- 播放三角形 -->
    <path d="M 22 18 L 22 42 L 42 30 Z" fill="white"/>
  </g>
  
  <!-- 底部格式标签 -->
  <g transform="translate(0, 380)">
    <!-- AVIF 标签 -->
    <rect x="70" y="0" width="80" height="35" rx="17.5" fill="rgba(255,255,255,0.25)"/>
    <text x="110" y="23" text-anchor="middle" font-size="18" font-weight="bold" fill="white">AVIF</text>
    
    <!-- JXL 标签 -->
    <rect x="170" y="0" width="70" height="35" rx="17.5" fill="rgba(255,255,255,0.25)"/>
    <text x="205" y="23" text-anchor="middle" font-size="18" font-weight="bold" fill="white">JXL</text>
    
    <!-- WebP 标签 -->
    <rect x="260" y="0" width="90" height="35" rx="17.5" fill="rgba(255,255,255,0.25)"/>
    <text x="305" y="23" text-anchor="middle" font-size="18" font-weight="bold" fill="white">WebP</text>
    
    <!-- GIF 标签 -->
    <rect x="370" y="0" width="70" height="35" rx="17.5" fill="rgba(255,255,255,0.25)"/>
    <text x="405" y="23" text-anchor="middle" font-size="18" font-weight="bold" fill="white">GIF</text>
  </g>
  
  <!-- 底部 PIXLY 文字 -->
  <text x="256" y="460" text-anchor="middle" font-size="48" font-weight="bold" fill="white" opacity="0.95">PIXLY</text>
  <text x="256" y="495" text-anchor="middle" font-size="20" font-weight="500" fill="white" opacity="0.7">Preview Player</text>
</svg>
