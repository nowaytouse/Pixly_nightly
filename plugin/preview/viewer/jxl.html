<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXLY JXL Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #previewImage {
            pointer-events: none;
            object-fit: contain;
            object-position: center;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            image-rendering: high-quality;
        }

        #info {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #info span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #loading {
            position: absolute;
            color: #fff;
            font-size: 14px;
        }

        .animated-badge {
            background: #4CAF50;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 10px;
        }
        
        #ffplayBtn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
            transition: all 0.2s;
        }
        
        #ffplayBtn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="container">
        <img id="previewImage" style="display: none;" />
        <div id="loading">加载中...</div>
        <div id="info" style="display: none;">
            <span id="format">JXL</span>
            <span id="dimensions">0 × 0</span>
            <span id="animated" style="display: none;" class="animated-badge">动画</span>
            <span id="frames" style="display: none;">0 帧</span>
            <button id="ffplayBtn" style="display: none;" title="使用 ffplay 外部播放器预览">🎬</button>
        </div>
    </div>

    <script>
        const { spawn } = require('child_process');
        const fs = require('fs');
        const path = require('path');

        const previewImage = document.getElementById('previewImage');
        const loading = document.getElementById('loading');
        const info = document.getElementById('info');
        const ffplayBtn = document.getElementById('ffplayBtn');

        // ffplay 外部预览按钮
        let currentFilePath = null;
        ffplayBtn.addEventListener('click', () => {
            if (currentFilePath) {
                playWithFFplay(currentFilePath);
            }
        });

        // 从 URL 参数获取文件路径
        const urlParams = new URLSearchParams(window.location.search);
        const filePath = urlParams.get('path') || eagle.item.filePath;

        console.log('[JXL Viewer] Loading:', filePath);

        /**
         * 检查文件扩展名
         */
        function checkFileExtension(filePath) {
            const ext = require('path').extname(filePath).toLowerCase();
            return ext === '.jxl';
        }

        /**
         * 加载并显示 JXL 文件
         */
        async function loadJXL() {
            try {
                // 检查文件扩展名
                if (!checkFileExtension(filePath)) {
                    const ext = require('path').extname(filePath).toLowerCase();
                    loading.innerHTML = `
                        <div class="error">
                            ⚠️ 文件格式错误<br>
                            <br>
                            此查看器仅支持 <strong>.jxl</strong> 文件<br>
                            当前文件类型: <strong>${ext || '未知'}</strong><br>
                            <br>
                            <small>请使用正确的查看器打开此文件</small>
                        </div>
                    `;
                    console.warn('[JXL Viewer] Invalid file type:', ext);
                    return;
                }
                
                loading.style.display = 'block';
                
                // 保存文件路径供 ffplay 使用
                currentFilePath = filePath;
                
                // 获取文件信息
                const fileInfo = await getJXLInfo(filePath);
                console.log('[JXL Viewer] File info:', fileInfo);
                
                // 解码第一帧
                const tempPngPath = await decodeJXL(filePath);
                
                // 直接使用 file:// 协议加载 APNG（保留动画）
                previewImage.onload = () => {
                    // 显示图像
                    previewImage.style.display = 'block';
                    
                    // 显示信息
                    updateInfo(previewImage.naturalWidth, previewImage.naturalHeight, fileInfo);
                    loading.style.display = 'none';
                    info.style.display = 'flex';
                };
                
                previewImage.onerror = () => {
                    loading.textContent = '⚠️ Unable to load image';
                };
                
                // 使用 file:// 协议加载（支持 APNG 动画）
                previewImage.src = 'file://' + tempPngPath;
                
            } catch (error) {
                console.error('[JXL Viewer] Error:', error);
                loading.innerHTML = `<div class="error">⚠️ Unable to load JXL file<br>${error.message}</div>`;
            }
        }

        /**
         * 获取 JXL 文件信息
         * 使用 ffprobe 检测动画
         */
        function getJXLInfo(filePath) {
            return new Promise((resolve) => {
                const ffprobePath = findFFprobe();
                if (!ffprobePath) {
                    // 没有 ffprobe，返回默认值
                    resolve({ 
                        animated: false, 
                        frames: 1,
                        width: 0,
                        height: 0
                    });
                    return;
                }

                const ffprobeProcess = spawn(ffprobePath, [
                    '-v', 'error',
                    '-select_streams', 'v:0',
                    '-count_frames',
                    '-show_entries', 'stream=nb_read_frames,duration,r_frame_rate',
                    '-of', 'default=noprint_wrappers=1',
                    filePath
                ]);

                let output = '';
                ffprobeProcess.stdout.on('data', (data) => {
                    output += data.toString();
                });

                ffprobeProcess.on('close', () => {
                    // 解析 ffprobe 输出
                    // nb_read_frames=131
                    // duration=10.140000
                    // r_frame_rate=12/1
                    const framesMatch = output.match(/nb_read_frames=(\d+)/);
                    const frames = framesMatch ? parseInt(framesMatch[1]) : 1;
                    
                    console.log(`[JXL Viewer] ffprobe detected ${frames} frames`);
                    resolve({ 
                        animated: frames > 1, 
                        frames,
                        width: 0,
                        height: 0
                    });
                });

                setTimeout(() => {
                    ffprobeProcess.kill();
                    resolve({ animated: false, frames: 1, width: 0, height: 0 });
                }, 5000);
            });
        }

        /**
         * 解码 JXL 到 PNG/APNG（支持动画）
         */
        function decodeJXL(filePath) {
            return new Promise((resolve, reject) => {
                const djxlPath = findDjxl();
                if (!djxlPath) {
                    reject(new Error('djxl not found'));
                    return;
                }

                const tempPng = path.join(
                    path.dirname(filePath),
                    `_pixly_viewer_${Date.now()}.png`
                );

                const process = spawn(djxlPath, [
                    filePath,
                    tempPng,
                    '--output_format=apng',  // 明确指定 APNG 格式
                    '--output_frames'        // 输出所有帧
                ]);

                process.on('close', (code) => {
                    if (code === 0 && fs.existsSync(tempPng)) {
                        // 返回临时文件路径（让浏览器直接加载 APNG）
                        resolve(tempPng);
                    } else {
                        reject(new Error(`djxl failed (code ${code})`));
                    }
                });

                setTimeout(() => {
                    process.kill();
                    reject(new Error('djxl timeout'));
                }, 15000);
            });
        }

        /**
         * 查找 djxl 工具
         */
        function findDjxl() {
            const paths = [
                '/opt/homebrew/bin/djxl',
                '/usr/local/bin/djxl',
                '/opt/local/bin/djxl',
                '/usr/bin/djxl',
            ];
            
            for (const p of paths) {
                if (fs.existsSync(p)) {
                    return p;
                }
            }
            
            return null;
        }

        /**
         * 更新信息显示
         */
        function updateInfo(width, height, fileInfo) {
            document.getElementById('dimensions').textContent = `${width} × ${height}`;
            
            if (fileInfo.animated) {
                document.getElementById('animated').style.display = 'inline-block';
                document.getElementById('frames').textContent = `${fileInfo.frames} 帧`;
                document.getElementById('frames').style.display = 'inline-block';
                
                // 显示 ffplay 按钮（用于动画预览）
                if (findFFplay()) {
                    ffplayBtn.style.display = 'inline-block';
                }
            }
        }
        
        /**
         * 查找 ffprobe 工具
         */
        function findFFprobe() {
            const paths = [
                '/opt/homebrew/bin/ffprobe',
                '/usr/local/bin/ffprobe',
                '/opt/local/bin/ffprobe',
                '/usr/bin/ffprobe',
            ];
            
            for (const p of paths) {
                if (fs.existsSync(p)) {
                    return p;
                }
            }
            
            return null;
        }

        /**
         * 查找 ffplay 工具
         */
        function findFFplay() {
            const paths = [
                '/opt/homebrew/bin/ffplay',
                '/usr/local/bin/ffplay',
                '/opt/local/bin/ffplay',
                '/usr/bin/ffplay',
            ];
            
            for (const p of paths) {
                if (fs.existsSync(p)) {
                    return p;
                }
            }
            
            return null;
        }
        
        /**
         * 使用 ffplay 外部播放器预览
         */
        function playWithFFplay(filePath) {
            const ffplayPath = findFFplay();
            if (!ffplayPath) {
                alert('未找到 ffplay 工具\n请安装 ffmpeg: brew install ffmpeg');
                return;
            }
            
            // 使用 ffplay 播放动画
            const { spawn } = require('child_process');
            const ffplayProcess = spawn(ffplayPath, [
                '-autoexit',           // 播放完毕自动退出
                '-loop', '0',          // 无限循环
                '-window_title', `JXL Preview - ${require('path').basename(filePath)}`,
                filePath
            ], {
                detached: true,         // 独立进程
                stdio: 'ignore'
            });
            
            ffplayProcess.unref();      // 让主进程不等待
            console.log('[JXL Viewer] Launched ffplay for:', filePath);
        }

        // 🔥 Phase 40.33: Eagle 原生功能支持
        // ✅ 通过 pointer-events: none 让 Eagle 处理所有交互（缩放、平移、侧键切换）
        // 参考: https://developer.eagle.cool/plugin-api/get-started/plugin-types/preview
        console.log('[JXL Viewer] ✅ Eagle native features enabled via pointer-events: none');

        // 加载文件
        loadJXL();
    </script>
</body>
</html>
