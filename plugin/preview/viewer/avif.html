<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXLY AVIF Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #previewImage {
            pointer-events: none;
            object-fit: contain;
            object-position: center;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            image-rendering: high-quality;
        }

        #info {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            transition: all 0.3s ease;
        }

        #info:hover {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
        }

        #info span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #loading {
            position: absolute;
            color: #fff;
            font-size: 14px;
        }

        .animated-badge {
            background: #2196F3;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 9px;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
        }

        #ffplayBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 1px 4px rgba(102, 126, 234, 0.3);
        }

        #ffplayBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.5);
        }

        #ffplayBtn:active {
            transform: translateY(0);
        }

        #info {
            z-index: 100 !important;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="container">
        <img id="previewImage" style="display: none;" />
        <div id="loading">加载中...</div>
        <div id="info" style="display: none;">
            <span id="format">AVIF</span>
            <span id="dimensions">0 × 0</span>
            <span id="animated" style="display: none;" class="animated-badge">动画</span>
            <span id="frames" style="display: none;">0 帧</span>
            <span id="fps" style="display: none;">0 FPS</span>
            <button id="ffplayBtn" style="display: none;" title="使用 ffplay 外部播放器预览完整动画">🎬 播放</button>
        </div>
    </div>

    <script>
        const { spawn } = require('child_process');
        const fs = require('fs');
        const path = require('path');

        const previewImage = document.getElementById('previewImage');
        const loading = document.getElementById('loading');
        const info = document.getElementById('info');
        const ffplayBtn = document.getElementById('ffplayBtn');

        // ffplay 外部预览按钮
        let currentFilePath = null;
        ffplayBtn.addEventListener('click', () => {
            if (currentFilePath) {
                playWithFFplay(currentFilePath);
            }
        });

        // 从 URL 参数获取文件路径
        const urlParams = new URLSearchParams(window.location.search);
        const filePath = urlParams.get('path') || eagle.item.filePath;

        console.log('[AVIF Viewer] Loading:', filePath);

        /**
         * 加载并显示 AVIF 文件
         */
        async function loadAVIF() {
            try {
                loading.style.display = 'block';
                loading.textContent = '加载中...';
                
                // 保存文件路径供 ffplay 使用
                currentFilePath = filePath;
                
                // 获取文件信息
                const fileInfo = await getAVIFInfo(filePath);
                console.log('[AVIF Viewer] File info:', fileInfo);
                
                // 解码第一帧
                loading.textContent = '解码图像...';
                const tempPngPath = await decodeAVIF(filePath);
                
                previewImage.onload = () => {
                    // 显示图像
                    previewImage.style.display = 'block';
                    
                    // 显示信息
                    updateInfo(previewImage.naturalWidth, previewImage.naturalHeight, fileInfo);
                    loading.style.display = 'none';
                    info.style.display = 'flex';
                };
                
                previewImage.onerror = () => {
                    loading.textContent = '⚠️ Unable to load image';
                };
                
                // 使用 file:// 协议加载
                previewImage.src = 'file://' + tempPngPath;
                
            } catch (error) {
                console.error('[AVIF Viewer] Error:', error);
                loading.innerHTML = `<div class="error">⚠️ Unable to load AVIF file<br>${error.message}</div>`;
            }
        }

        /**
         * 获取 AVIF 文件信息
         * ⚠️ ffprobe 对 AVIF 帧数检测不准确，改用 avifdec --info
         */
        function getAVIFInfo(filePath) {
            return new Promise((resolve) => {
                const avifdecPath = findAvifdec();
                if (!avifdecPath) {
                    // 如果没有 avifdec，假设是动画（由转换过程决定）
                    resolve({ animated: true, frames: 0, fps: 10 });
                    return;
                }

                const avifdecProcess = spawn(avifdecPath, [
                    '--info',
                    filePath
                ]);
                
                let stdout = '';
                let stderr = '';
                
                avifdecProcess.stdout.on('data', (data) => {
                    stdout += data.toString();
                });
                
                avifdecProcess.stderr.on('data', (data) => {
                    stderr += data.toString();
                });
                
                avifdecProcess.on('close', (code) => {
                    const output = stdout + stderr;
                    
                    // 解析 avifdec --info 输出
                    // 支持多种格式:
                    // - "Image count: 128"
                    // - "Frame count: 128"
                    // - "Image Sequence Frames: (131 expected frames)"
                    // - "19840 timescales per second, 10.14 seconds (201216 timescales), 131 frames"
                    const frameMatch = output.match(/Image count:\s*(\d+)/i) || 
                                     output.match(/Frame count:\s*(\d+)/i) ||
                                     output.match(/\((\d+)\s+expected\s+frames\)/i) ||
                                     output.match(/,\s*(\d+)\s+frames/i);
                    const frames = frameMatch ? parseInt(frameMatch[1]) : 1;
                    
                    // 解析 FPS
                    // 示例: "19840 timescales per second, 10.14 seconds (201216 timescales), 131 frames"
                    // 计算: frames / seconds
                    const secondsMatch = output.match(/(\d+\.?\d*)\s+seconds/);
                    let fps = 10; // 默认值
                    if (secondsMatch && frames > 1) {
                        const seconds = parseFloat(secondsMatch[1]);
                        if (seconds > 0) {
                            fps = Math.round((frames / seconds) * 100) / 100;
                        }
                    }
                    
                    console.log(`[AVIF Viewer] avifdec detected ${frames} frames @ ${fps} fps`);
                    resolve({ 
                        animated: frames > 1, 
                        frames, 
                        fps 
                    });
                });

                setTimeout(() => {
                    avifdecProcess.kill();
                    resolve({ animated: true, frames: 0, fps: 0 });
                }, 5000);
            });
        }
        
        /**
         * 查找 ffprobe 工具
         */
        function findFFprobe() {
            const paths = [
                '/opt/homebrew/bin/ffprobe',
                '/usr/local/bin/ffprobe',
                '/opt/local/bin/ffprobe',
                '/usr/bin/ffprobe',
            ];
            
            for (const p of paths) {
                if (fs.existsSync(p)) {
                    return p;
                }
            }
            
            return null;
        }

        /**
         * 解码 AVIF 到 PNG
         */
        function decodeAVIF(filePath) {
            return new Promise((resolve, reject) => {
                const ffmpegPath = findFFmpeg();
                if (!ffmpegPath) {
                    reject(new Error('ffmpeg not found'));
                    return;
                }

                const tempPng = path.join(
                    path.dirname(filePath),
                    `_pixly_viewer_${Date.now()}.png`
                );

                // 使用 ffmpeg 转换 AVIF → APNG（支持动画）
                const ffmpegProcess = spawn(ffmpegPath, [
                    '-i', filePath,
                    '-f', 'apng',      // 明确指定 APNG 格式
                    '-plays', '0',     // 无限循环
                    '-y', tempPng
                ], {
                    env: {
                        ...process.env,
                        PATH: `/opt/homebrew/bin:/usr/local/bin:/opt/local/bin:/usr/bin:${process.env.PATH}`
                    }
                });

                let stderr = '';
                ffmpegProcess.stderr.on('data', (data) => {
                    stderr += data.toString();
                });

                ffmpegProcess.on('close', (code) => {
                    if (code === 0 && fs.existsSync(tempPng)) {
                        // 返回临时文件路径（让浏览器直接加载 APNG）
                        resolve(tempPng);
                    } else {
                        reject(new Error(`ffmpeg (AVIF→APNG) failed (code ${code}): ${stderr}`));
                    }
                });

                setTimeout(() => {
                    ffmpegProcess.kill();
                    reject(new Error('ffmpeg timeout'));
                }, 30000);
            });
        }

        /**
         * 查找 ffmpeg 工具
         */
        /**
         * 查找 avifdec 工具
         */
        function findAvifdec() {
            const paths = [
                '/opt/homebrew/bin/avifdec',
                '/usr/local/bin/avifdec',
                '/opt/local/bin/avifdec',
                '/usr/bin/avifdec',
            ];
            
            for (const p of paths) {
                if (fs.existsSync(p)) {
                    return p;
                }
            }
            
            return null;
        }
        
        /**
         * 查找 ffprobe 工具
         */
        function findFFprobe() {
            const paths = [
                '/opt/homebrew/bin/ffprobe',
                '/usr/local/bin/ffprobe',
                '/opt/local/bin/ffprobe',
                '/usr/bin/ffprobe',
            ];
            
            for (const p of paths) {
                if (fs.existsSync(p)) {
                    return p;
                }
            }
            
            return null;
        }
        
        /**
         * 查找 ffmpeg 工具
         */
        function findFFmpeg() {
            const paths = [
                '/opt/homebrew/bin/ffmpeg',
                '/usr/local/bin/ffmpeg',
                '/opt/local/bin/ffmpeg',
                '/usr/bin/ffmpeg',
            ];
            
            for (const p of paths) {
                if (fs.existsSync(p)) {
                    return p;
                }
            }
            
            return null;
        }
        
        /**
         * 查找 ffplay 工具
         */
        function findFFplay() {
            const paths = [
                '/opt/homebrew/bin/ffplay',
                '/usr/local/bin/ffplay',
                '/opt/local/bin/ffplay',
                '/usr/bin/ffplay',
            ];
            
            for (const p of paths) {
                if (fs.existsSync(p)) {
                    return p;
                }
            }
            
            return null;
        }

        /**
         * 更新信息显示
         */
        function updateInfo(width, height, fileInfo) {
            document.getElementById('dimensions').textContent = `${width} × ${height}`;
            
            if (fileInfo.animated) {
                document.getElementById('animated').style.display = 'inline-block';
                document.getElementById('frames').textContent = `${fileInfo.frames} 帧`;
                document.getElementById('frames').style.display = 'inline-block';
                
                if (fileInfo.fps > 0) {
                    document.getElementById('fps').textContent = `${fileInfo.fps} FPS`;
                    document.getElementById('fps').style.display = 'inline-block';
                }
                
                // 显示 ffplay 按钮（用于动画预览，需要 ffplay 工具）
                if (findFFplay()) {
                    ffplayBtn.style.display = 'inline-block';
                }
            }
        }
        
        /**
         * 使用 ffplay 外部播放器预览
         */
        function playWithFFplay(filePath) {
            const ffplayPath = findFFplay();
            if (!ffplayPath) {
                alert('未找到 ffplay 工具\n请安装 ffmpeg: brew install ffmpeg');
                return;
            }
            
            // 使用 ffplay 播放动画
            const { spawn } = require('child_process');
            const ffplayProcess = spawn(ffplayPath, [
                '-x', '800',           // 窗口宽度 800px
                '-y', '600',           // 窗口高度 600px
                '-autoexit',           // 播放完毕自动退出
                '-loop', '0',          // 无限循环
                '-alwaysontop',        // 窗口始终在前台
                '-window_title', `AVIF Preview - ${require('path').basename(filePath)}`,
                filePath
            ]);
            
            console.log('[AVIF Viewer] Launched ffplay for:', filePath);
        }

        // 🔥 Phase 40.33: Eagle 原生功能支持
        // ✅ 通过 pointer-events: none 让 Eagle 处理所有交互（缩放、平移、侧键切换）
        // 参考: https://developer.eagle.cool/plugin-api/get-started/plugin-types/preview
        console.log('[AVIF Viewer] ✅ Eagle native features enabled via pointer-events: none');

        // 加载文件
        loadAVIF();
    </script>
</body>
</html>
