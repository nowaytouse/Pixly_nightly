<div id="emptyState" class="empty-state">
            <div class="empty-state-icon">📁</div>
            <div class="empty-state-title" data-i18n="empty.noFiles">No Files Selected</div>
            <div class="empty-state-message" data-i18n="empty.selectPrompt">
                Select files in Eagle, then return to plugin to start conversion
            </div>
            <div class="empty-state-steps">
                <div class="empty-state-step" data-i18n="[title]empty.selectFilesTooltip">
                    <div class="empty-state-step-number">1</div>
                    <div class="empty-state-step-title" data-i18n="empty.selectFiles">Select Files</div>
                </div>
                <div class="empty-state-step" data-i18n="[title]empty.selectModeTooltip">
                    <div class="empty-state-step-number">2</div>
                    <div class="empty-state-step-title" data-i18n="empty.selectMode">Select Mode</div>
                </div>
                <div class="empty-state-step" data-i18n="[title]empty.startConversionTooltip">
                    <div class="empty-state-step-number">3</div>
                    <div class="empty-state-step-title" data-i18n="empty.startConversion">Start Conversion</div>
                </div>
            </div>
        </div>
