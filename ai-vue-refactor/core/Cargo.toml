[package]
name = "pixly_kernel"
version = "3.0.0"
edition = "2024"
authors = ["Pixly Team"]
description = "AI-driven media format converter with intelligent optimization"
readme = "README.md"
homepage = "https://github.com/yourusername/pixly"
repository = "https://github.com/yourusername/pixly"
license = "MIT"
keywords = ["image", "video", "converter", "ai", "optimization"]
categories = ["multimedia", "command-line-utilities"]
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
image = { version = "0.25", features = ["jpeg", "png", "webp", "gif"] }
imageproc = "0.25"
tracing = "0.1"
thiserror = "2.0"
num_cpus = "1.16"
fast_image_resize = "5.1"
rayon = "1.10"
log = "0.4"
env_logger = "0.11"
indicatif = "0.17"
once_cell = "1.20"
which = "7.0"
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-perl"] }
md5 = "0.7"
blake3 = { version = "1.5", features = ["rayon"] }
hex = "0.4"
infer = "0.16"
sysinfo = "0.32"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
filetime = "0.2"
flate2 = "1.0"

# Platform-specific dependencies
[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.3"

[target.'cfg(target_os = "linux")'.dependencies]
xattr = "1.3"

[dev-dependencies]
tempfile = "3.14"
tokio = { version = "1.41", features = ["full"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "conversion_benchmark"
harness = false

[lints.rust]
unused_imports = "deny"
unused_variables = "deny"
dead_code = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[profile.dev]
opt-level = 1

[features]
default = [
    "image-base",
    "video-base",
    "ai-core",
]

# ========================================
# Plugin-specific features
# ========================================

# format-vue: 基础转换 - 图像/视频/动图 + 辅助功能（不含 AI）
plugin-format-vue = [
    "image-base",
    "video-base",
    "xmp",
    "file-validation",
    "ssim",
    "filename-normalize",
]

# ai-vue-refactor: 智能转换 - 图像/视频/动图 + AI 参数预测 + 辅助功能
plugin-ai-vue = [
    "ai-core",
    "image-base",
    "video-base",
    "xmp",
    "file-validation",
    "ssim",
    "filename-normalize",
    "gpu",
    "scene-detection",
    "vmaf",
]

# ========================================
# Image encoder features
# ========================================
image-base = []
image-modern = ["image-base"]
image-all = ["image-modern"]

# ========================================
# Video encoder features
# ========================================
video-base = []
video-modern = ["video-base"]
video-experimental = ["video-modern"]

# ========================================
# AI features
# ========================================
ai-core = []
ai-advanced = ["ai-core"]

# ========================================
# Shared utility features (辅助功能)
# ========================================
xmp = []              # XMP 合并
filename-normalize = []  # 文件名规范化
file-validation = []  # Magika 文件验证
ssim = []             # SSIM 质量检测

# ========================================
# Performance features
# ========================================
simd = []
gpu = []
scene-detection = []  # 视频场景检测
vmaf = []             # VMAF 视频质量评估

[[bin]]
name = "pixly-kernel"
path = "pixly_kernel_cli.rs"

[[bin]]
name = "pixly-kernel-video"
path = "pixly_kernel_video_cli.rs"

[[bin]]
name = "pixly-converter"
path = "pixly_converter_cli.rs"
