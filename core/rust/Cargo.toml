[package]
name = "pixly_performance_core"
version = "3.1.0"
edition = "2021"
rust-version = "1.80"  # 2025标准：最新稳定版Rust
authors = ["PIXLY Team <team@pixly.ai>"]
description = "Ultra-high performance Rust core for PIXLY v3.1 with 2025 SIMD, GPU acceleration and PyO3 bindings"
license = "MIT"
repository = "https://github.com/nowaytouse/Pixly_nightly"
readme = "README.md"
keywords = ["image-processing", "ai", "performance", "simd", "gpu"]
categories = ["multimedia::images", "science", "algorithms"]

[lib]
name = "pixly_performance_core"
crate-type = ["cdylib", "rlib"]  # Python集成 + Rust库

[dependencies]
# 核心依赖
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# PyO3 Python绑定 (2025年最新版本)
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310", "auto-initialize"] }
numpy = "0.22"  # NumPy集成
anyhow = "1.0"
thiserror = "2.0"  # 2025标准：v2版本
log = "0.4"
env_logger = "0.11"  
tracing = "0.1"  # 2025标准：结构化日志
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }  # 2025：高级追踪

# 🚀 SIMD优化 (单指令多数据) - 使用稳定版本
# packed_simd = { version = "0.3", optional = true }  # 有兼容性问题，暂时移除
wide = { version = "0.7", optional = true }
# simdeez = { version = "2.0", optional = true }  # 可能有依赖问题，暂时移除

# 🚀 并行计算 (2025最新版本)
rayon = "1.10"     # 数据并行 - 2025最新
crossbeam = "0.8"  # 无锁并发
tokio = { version = "1.40", features = ["full", "tracing"] }  # 2025异步运行时
async-std = { version = "1.12", optional = true }  # 2025备选异步运行时
num_cpus = "1.16"  # CPU核心检测

# 🖼️ 图像处理 (高性能版本)
image = { version = "0.24", features = ["avif", "webp", "png", "jpeg", "gif", "hdr", "tiff"] }
imageproc = "0.23"
fast_image_resize = "3.0"  # SIMD优化的图像缩放
rgb = "0.8"
imgref = "1.10"
gif = "0.12"            # GIF编解码
png = "0.17"            # PNG编解码

# 📁 文件系统处理
walkdir = "2.4"         # 目录遍历
regex = "1.10"          # 正则表达式
lazy_static = "1.4"     # 静态变量初始化
infer = "0.15"          # 文件类型检测
mime_guess = "2.0"      # MIME类型推断

# 🚀 GPU计算 (2025年统一GPU加速)
wgpu = { version = "0.20", optional = true }               # WebGPU统一API
bytemuck = { version = "1.16", optional = true }          # 字节转换 
pollster = { version = "0.3", optional = true }           # 异步阻塞

# 🚀 CUDA GPU加速 (专业级)
cudarc = { version = "0.11", optional = true }            # CUDA Rust绑定
candle-core = { version = "0.6", optional = true }        # 机器学习张量计算

# 🧮 数学计算 (SIMD优化)
nalgebra = { version = "0.32", features = ["serde-serialize"] }
ndarray = { version = "0.15", features = ["serde", "rayon"] }
faer = "0.14"  # 极速线性代数
matrixmultiply = "0.3"

# 🔢 机器学习推理 (暂时注释，等待版本兼容)
# candle-core = { version = "0.3" }  # Meta的Rust ML框架
# candle-nn = { version = "0.3" }
ort = { version = "2.0.0-rc.10", features = ["download-binaries"], optional = true }  # ONNX Runtime

# 📊 性能监控
criterion = { version = "0.5", optional = true }
pprof = { version = "0.14", features = ["flamegraph", "protobuf-codec"], optional = true }

# 🔧 转换引擎依赖
chrono = { version = "0.4", features = ["serde"] }
md5 = "0.7"              # 请求ID生成
memmap2 = "0.9"          # 内存映射

# 💾 内存管理
mimalloc = { version = "0.1", default-features = false }  # 高性能内存分配器
shared_memory = "0.12"  # 零拷贝共享内存

# 🔐 安全哈希 (SIMD优化)
blake3 = "1.5"  # 极速哈希算法
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# 🧵 线程池
threadpool = "1.8"
crossbeam-channel = "0.5"

# C FFI
libc = "0.2"

[features]
default = ["simd", "profiling"]
simd = ["wide"]                                     # SIMD加速 (稳定版本)
gpu = ["wgpu", "bytemuck", "pollster"]               # GPU计算
profiling = ["criterion", "pprof"]                   # 性能分析
ml = ["ort"]                                        # 机器学习推理
avx2 = []      # AVX2指令集支持  
avx512 = []    # AVX512指令集支持
cuda = ["cudarc", "candle-core"]      # CUDA支持 (GPU加速)
performance = []    # 性能核心功能
ai-client = []      # AI客户端功能

# 🚀 极限性能优化配置
[profile.release]
opt-level = 3              # 最高优化级别
lto = "fat"                # 链接时优化 (整个程序)
codegen-units = 1          # 单个代码生成单元
panic = "abort"            # Panic时直接中止 (更小体积)
strip = true               # 剥离调试信息
overflow-checks = false    # 关闭溢出检查 (Release模式)

# 🎯 目标CPU优化
[profile.release.build-override]
opt-level = 3

# 开发配置
[profile.dev]
opt-level = 1
debug = true

# 性能测试配置
[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = false

# PyO3构建配置
[build-dependencies]
pyo3-build-config = "0.20"

# Rust目标平台优化
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# CPU特定优化标志
[package.metadata.cargo-machete]
ignored = ["pyo3-build-config"]

# 内存分配器配置 - 使用mimalloc提升性能
[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = { version = "0.5", optional = true }

[target.'cfg(target_env = "msvc")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

# 平台特定的SIMD优化
[target.'cfg(target_arch = "x86_64")'.dependencies]
# x86_64特定的SIMD库可以在这里添加

[target.'cfg(target_arch = "aarch64")'.dependencies]
# ARM64特定的SIMD库可以在这里添加

# 文档生成
[[example]]
name = "performance_benchmark"
path = "examples/performance_benchmark.rs"
required-features = ["profiling"]

[[example]]
name = "simd_image_processing"
path = "examples/simd_image_processing.rs"
required-features = ["simd"]

[[example]]  
name = "gpu_acceleration"
path = "examples/gpu_acceleration.rs"
required-features = ["gpu"]
