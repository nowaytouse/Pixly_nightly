[package]
name = "pixly_performance_core"
version = "3.0.0"
edition = "2021"
authors = ["PIXLY Team <team@pixly.ai>"]
description = "Ultra-high performance Rust core for PIXLY v3.0 with SIMD, GPU acceleration and PyO3 bindings"
license = "MIT"
repository = "https://github.com/pixly/pixly-nightly"

[lib]
name = "pixly_performance_core"
crate-type = ["cdylib", "rlib"]  # Python集成 + Rust库

# PyO3 Python绑定
[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
numpy = "0.20"  # NumPy集成

# 核心依赖
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"

# 🚀 SIMD优化 (单指令多数据)
packed_simd = "0.3"
wide = "0.7"
simdeez = "2.0"

# 🚀 并行计算
rayon = "1.8"      # 数据并行
crossbeam = "0.8"  # 无锁并发
tokio = { version = "1.35", features = ["full"] }  # 异步运行时
num_cpus = "1.16"  # CPU核心检测

# 🖼️ 图像处理 (高性能版本)
image = { version = "0.24", features = ["avif", "webp", "png", "jpeg", "gif", "hdr", "tiff"] }
imageproc = "0.23"
fast_image_resize = "3.0"  # SIMD优化的图像缩放
rgb = "0.8"
imgref = "1.10"

# 🎯 GPU计算 (通过wgpu)
wgpu = { version = "0.18", features = ["spirv"] }
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"  # 阻塞式async执行器

# 🧮 数学计算 (SIMD优化)
nalgebra = { version = "0.32", features = ["serde-serialize"] }
ndarray = { version = "0.15", features = ["serde", "rayon"] }
faer = "0.14"  # 极速线性代数
matrixmultiply = "0.3"

# 🔢 机器学习推理
candle-core = { version = "0.3" }  # Meta的Rust ML框架
candle-nn = { version = "0.3" }
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }  # ONNX Runtime

# 📊 性能监控
criterion = { version = "0.5", optional = true }
pprof = { version = "0.13", features = ["flamegraph", "protobuf-codec"], optional = true }

# 💾 内存管理
mimalloc = { version = "0.1", default-features = false }  # 高性能内存分配器
shared_memory = "0.12"  # 零拷贝共享内存

# 🔐 安全哈希 (SIMD优化)
blake3 = "1.5"  # 极速哈希算法
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# 🧵 线程池
threadpool = "1.8"
crossbeam-channel = "0.5"

[features]
default = ["simd", "gpu", "profiling"]
simd = ["packed_simd", "wide", "simdeez"]           # SIMD加速
gpu = ["wgpu", "bytemuck", "pollster"]               # GPU计算
profiling = ["criterion", "pprof"]                   # 性能分析
avx2 = []      # AVX2指令集支持  
avx512 = []    # AVX512指令集支持
cuda = []      # CUDA支持 (未来)

# 🚀 极限性能优化配置
[profile.release]
opt-level = 3              # 最高优化级别
lto = "fat"                # 链接时优化 (整个程序)
codegen-units = 1          # 单个代码生成单元
panic = "abort"            # Panic时直接中止 (更小体积)
strip = true               # 剥离调试信息
overflow-checks = false    # 关闭溢出检查 (Release模式)

# 🎯 目标CPU优化
[profile.release.build-override]
opt-level = 3

# 开发配置
[profile.dev]
opt-level = 1
debug = true

# 性能测试配置
[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = false

# PyO3构建配置
[build-dependencies]
pyo3-build-config = "0.20"

# Rust目标平台优化
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# CPU特定优化标志
[package.metadata.cargo-machete]
ignored = ["pyo3-build-config"]

# 内存分配器配置 - 使用mimalloc提升性能
[target.'cfg(not(target_env = "msvc"))'.dependencies]
jemallocator = { version = "0.5", optional = true }

[target.'cfg(target_env = "msvc")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

# 平台特定的SIMD优化
[target.'cfg(target_arch = "x86_64")'.dependencies]
# x86_64特定的SIMD库可以在这里添加

[target.'cfg(target_arch = "aarch64")'.dependencies]
# ARM64特定的SIMD库可以在这里添加

# 文档生成
[[example]]
name = "performance_benchmark"
path = "examples/performance_benchmark.rs"
required-features = ["profiling"]

[[example]]
name = "simd_image_processing"
path = "examples/simd_image_processing.rs"
required-features = ["simd"]

[[example]]  
name = "gpu_acceleration"
path = "examples/gpu_acceleration.rs"
required-features = ["gpu"]
