# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Pixly 统一配置文件 (TOML格式)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 
# Phase UC-003: 代码统一 - 跨语言配置文件
# 
# 此文件被Rust和Python两端共同使用
# 格式: TOML (Rust原生支持，Python通过toml库支持)
# 
# 环境变量覆盖规则:
# - 配置键 "app.debug_mode" -> 环境变量 "PIXLY_APP_DEBUG_MODE"
# - 配置键 "ai.enabled" -> 环境变量 "PIXLY_AI_ENABLED"

[app]
name = "Pixly"
version = "3.0.0"
environment = "production"  # development, staging, production
debug_mode = false
data_dir = "./data"
cache_dir = "./cache" 
temp_dir = "/tmp/pixly"

[ai]
enabled = true
predictor_type = "local"  # local, remote, hybrid
model_version = "3.0.0"
timeout_ms = 5000
retry_count = 3
confidence_threshold = 0.8
fallback_enabled = true
cache_predictions = true

[converter]
max_parallel_tasks = 8  # 0 = auto-detect CPU cores
memory_limit_mb = 2048
temp_cleanup = true
preserve_metadata = true
supported_formats = ["avif", "jxl", "webp", "png", "jpeg", "gif"]

# 质量预设配置
[converter.quality_presets.fast]
name = "Fast"
description = "快速转换，较低质量"
quality = 70
speed = 2
lossless = false

[converter.quality_presets.balanced]
name = "Balanced" 
description = "平衡质量和速度"
quality = 80
speed = 4
lossless = false

[converter.quality_presets.high_quality]
name = "High Quality"
description = "高质量，较慢速度"
quality = 90
speed = 6
lossless = false

[converter.quality_presets.lossless]
name = "Lossless"
description = "无损压缩"
quality = 100
speed = 8
lossless = true

[performance]
simd_enabled = true
gpu_acceleration = false  # 需要手动启用
thread_pool_size = 0  # 0 = auto-detect
memory_pool_size_mb = 512
io_buffer_size_kb = 64
benchmark_mode = false

[logging]
level = "INFO"  # TRACE, DEBUG, INFO, WARN, ERROR
json_format = false
file_output = false
file_path = "./logs/pixly.log"
max_file_size_mb = 100
max_files = 5

# 用户自定义配置区域
[custom]
# 用户可以在这里添加任意自定义配置
# 示例:
# user_name = "developer"
# favorite_format = "avif"
# batch_size = 50
