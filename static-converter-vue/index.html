<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Static Converter</title>
<style>
:root{--primary:#3297ff;--primary-jxl:#3297ff;--primary-avif:#ff6b35;--text-1:rgba(255,255,255,.95);--text-2:rgba(255,255,255,.75);--text-3:rgba(255,255,255,.55);--bg-1:#1e1e1e;--bg-2:#2a2a2a;--border:rgba(255,255,255,.12);--success:#34c759;--warning:#ff9500;--error:#ff3b30}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg-1);color:var(--text-1);display:flex;flex-direction:column;font-size:14px}
.titlebar{height:40px;background:var(--bg-2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;-webkit-app-region:drag;user-select:none;flex-shrink:0}
.titlebar-title{flex:1;text-align:center;font-size:14px;font-weight:500;color:var(--text-2)}
.titlebar-btns{display:flex;gap:8px;-webkit-app-region:no-drag}
.titlebar-btn{width:32px;height:32px;border:none;background:0 0;border-radius:6px;cursor:pointer;color:var(--text-3);font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.titlebar-btn:hover{background:rgba(255,255,255,.08);color:var(--text-1);transform:scale(1.05)}
.titlebar-btn.close:hover{background:var(--error);color:#fff}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.mode-tabs{display:flex;background:var(--bg-2);border-bottom:1px solid var(--border);padding:8px 16px;gap:8px;flex-shrink:0}
.mode-tab{flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:10px;background:var(--bg-1);cursor:pointer;transition:all .2s;text-align:center}
.mode-tab:hover{border-color:rgba(255,255,255,.2)}
.mode-tab.active{border-color:var(--primary);background:rgba(50,151,255,.1)}
.mode-tab.active.avif{border-color:var(--primary-avif);background:rgba(255,107,53,.1)}
.mode-tab-icon{font-size:22px;margin-bottom:2px}
.mode-tab-title{font-size:13px;font-weight:600;margin-bottom:1px}
.mode-tab-desc{font-size:10px;color:var(--text-3)}
.header{padding:12px 20px;background:var(--bg-2);border-bottom:1px solid var(--border);flex-shrink:0}
.header-title{font-size:16px;font-weight:600;margin-bottom:2px}
.header-subtitle{font-size:12px;color:var(--text-3)}
.tech-badge{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:5px 8px;background:rgba(52,199,89,.1);border:1px solid rgba(52,199,89,.2);border-radius:6px;font-size:11px;color:var(--success)}
.tech-badge.avif{background:rgba(255,107,53,.1);border-color:rgba(255,107,53,.2);color:var(--primary-avif)}
.settings{padding:12px 20px;background:var(--bg-2);border-bottom:1px solid var(--border);flex-shrink:0}
.settings-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.settings-row:last-child{margin-bottom:0}
.settings-label{font-size:13px;color:var(--text-2);min-width:80px}
.settings-input{display:flex;align-items:center;gap:8px}
.settings-input input{width:65px;height:32px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg-1);color:var(--text-1);font-size:13px;text-align:center}
.settings-input input:focus{outline:none;border-color:var(--primary)}
.settings-input select{height:32px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg-1);color:var(--text-1);font-size:13px;cursor:pointer}
.settings-hint{font-size:11px;color:var(--text-3);padding:8px 10px;background:rgba(50,151,255,.08);border-radius:6px;line-height:1.4}
.settings-hint.avif{background:rgba(255,107,53,.08)}
.settings-hint code{background:rgba(0,0,0,.3);padding:1px 4px;border-radius:3px;font-family:monospace}
.stats{display:flex;gap:1px;background:var(--border);border-bottom:1px solid var(--border);flex-shrink:0}
.stat{flex:1;padding:10px 14px;background:var(--bg-2);transition:background .2s}
.stat:hover{background:rgba(50,151,255,.05)}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);margin-bottom:2px}
.stat-value{font-size:18px;font-weight:700;color:var(--primary)}
.stat-value.avif{color:var(--primary-avif)}
.file-section{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.section-header{padding:8px 16px;background:var(--bg-2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.section-title{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase}
.badge{background:rgba(50,151,255,.2);color:var(--primary);padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.avif{background:rgba(255,107,53,.2);color:var(--primary-avif)}
.file-list{flex:1;overflow-y:auto;padding:6px;min-height:0}
.file-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg-2);border:1px solid rgba(255,255,255,.08);border-radius:8px;margin-bottom:4px;transition:all .2s;animation:fadeIn .3s ease}
.file-item:hover{background:rgba(50,151,255,.08);border-color:rgba(50,151,255,.3)}
.file-item.skipped{opacity:.5}
.file-item .skip-reason{font-size:10px;color:var(--warning)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.file-icon{width:32px;height:32px;background:rgba(50,151,255,.1);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.file-name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-ext{font-size:11px;color:var(--text-3)}
.file-size{font-size:11px;color:var(--text-3)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.empty-icon{font-size:40px;margin-bottom:10px;opacity:.3}
.empty-title{font-size:14px;font-weight:600;margin-bottom:4px}
.empty-desc{font-size:12px;color:var(--text-3);line-height:1.4}
.footer{padding:12px 16px;background:var(--bg-2);border-top:1px solid var(--border);flex-shrink:0}
.footer-row{display:flex;gap:10px;align-items:center}
.btn-s{height:38px;padding:0 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:var(--bg-1);color:var(--text-2);transition:all .2s;display:flex;align-items:center;gap:5px}
.btn-s:hover:not(:disabled){background:rgba(255,255,255,.05);color:var(--text-1);border-color:var(--primary)}
.btn-s:disabled{opacity:.4;cursor:not-allowed}
.btn-p{flex:1;height:40px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:var(--primary);color:#fff;transition:all .2s;position:relative;overflow:hidden}
.btn-p.avif{background:var(--primary-avif)}
.btn-p:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(50,151,255,.3)}
.btn-p.avif:hover:not(:disabled){box-shadow:0 4px 12px rgba(255,107,53,.3)}
.btn-p:disabled{opacity:.4;cursor:not-allowed}
.btn-p.loading::after{content:'';position:absolute;width:18px;height:18px;border:2px solid transparent;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;right:14px;top:50%;margin-top:-9px}
.status{margin-top:8px;padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.4}
.status-ok{background:rgba(52,199,89,.1);color:var(--success);border:1px solid rgba(52,199,89,.2)}
.status-warn{background:rgba(255,149,0,.1);color:var(--warning);border:1px solid rgba(255,149,0,.2)}
.status-err{background:rgba(255,59,48,.1);color:var(--error);border:1px solid rgba(255,59,48,.2)}
.progress{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.progress-bar{height:100%;background:var(--primary);border-radius:2px;transition:width .3s ease;width:0}
.progress-bar.avif{background:var(--primary-avif)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000;pointer-events:none}
.modal-overlay.show{display:flex;pointer-events:auto}
.modal{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;width:90%;max-width:380px;max-height:75vh;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.modal-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.modal-close{width:26px;height:26px;border:none;background:0 0;border-radius:6px;cursor:pointer;color:var(--text-3);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:var(--error);color:#fff}
.modal-body{padding:14px;overflow-y:auto;max-height:calc(75vh - 60px)}
.help-section{margin-bottom:12px}
.help-section:last-child{margin-bottom:0}
.help-title{font-size:13px;font-weight:600;color:var(--primary);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.help-title.avif{color:var(--primary-avif)}
.help-content{font-size:12px;color:var(--text-2);line-height:1.6;padding:10px;background:var(--bg-1);border-radius:6px;border:1px solid var(--border)}
.help-content code{background:rgba(50,151,255,.15);color:var(--primary);padding:1px 4px;border-radius:3px;font-family:monospace;font-size:11px}
.help-tip{font-size:11px;color:var(--warning);margin-top:8px;padding:8px;background:rgba(255,149,0,.1);border-radius:6px;border:1px solid rgba(255,149,0,.2)}
</style>
</head>
<body>
<div class="titlebar">
<div class="titlebar-btns"><button class="titlebar-btn" id="langBtn">🌐</button><button class="titlebar-btn" id="helpBtn">?</button></div>
<div class="titlebar-title" id="titleText">Static Converter</div>
<div class="titlebar-btns">
<button class="titlebar-btn" id="minBtn">−</button>
<button class="titlebar-btn" id="maxBtn">□</button>
<button class="titlebar-btn close" id="closeBtn">×</button>
</div>
</div>
<div class="main">
<div class="mode-tabs">
<div class="mode-tab active" id="tabJxl" data-mode="jxl">
<div class="mode-tab-icon">🔒</div>
<div class="mode-tab-title">JXL</div>
<div class="mode-tab-desc" id="tabJxlDesc">高质量无损</div>
</div>
<div class="mode-tab" id="tabAvif" data-mode="avif">
<div class="mode-tab-icon">😂</div>
<div class="mode-tab-title">AVIF</div>
<div class="mode-tab-desc" id="tabAvifDesc">表情包优化</div>
</div>
</div>
<div class="header">
<div class="header-title" id="hTitle">Static to JXL</div>
<div class="header-subtitle" id="hSub">Smart lossless conversion</div>
<div class="tech-badge" id="techBadge"><span>🔒</span><span id="techText">JPEG Reversible + Lossless</span></div>
</div>
<div id="settingsPanel"></div>
<div id="statsPanel"></div>
<div id="fileSection"></div>
</div>
<div id="footerPanel"></div>
<div class="modal-overlay" id="helpModal"><div class="modal" id="modalContent"></div></div>
</body>
</html>

<script>
'use strict';
const LOG={DEBUG:0,INFO:1,WARN:2,ERROR:3};
const K={INIT:'cvt.init',TOOL:'cvt.tool',FILE:'cvt.file',CVT:'cvt.cvt',EAGLE:'cvt.eagle'};
let logLvl=LOG.INFO;
const log={
  _f:(k,m,d)=>{const t=new Date().toISOString().slice(11,23);return d?['['+t+']['+k+']',m,d]:['['+t+']['+k+']',m];},
  i:(k,m,d)=>{if(logLvl<=LOG.INFO)console.log(...log._f(k,m,d));},
  w:(k,m,d)=>{if(logLvl<=LOG.WARN)console.warn(...log._f(k,m,d));},
  e:(k,m,d)=>{if(logLvl<=LOG.ERROR)console.error(...log._f(k,m,d));}
};

const FORMATS_JXL={
  jpeg:{exts:['jpg','jpeg','jpe','jfif'],icon:'📷',lossless:false},
  png:{exts:['png'],icon:'🖼️',lossless:true},
  bmp:{exts:['bmp'],icon:'🎨',lossless:true},
  tiff:{exts:['tif','tiff'],icon:'📄',lossless:true},
  tga:{exts:['tga'],icon:'🎮',lossless:true},
  ppm:{exts:['ppm','pbm','pgm'],icon:'📊',lossless:true}
};
const FORMATS_AVIF={
  jpeg:{exts:['jpg','jpeg','jpe','jfif'],icon:'📷',lossless:false},
  png:{exts:['png'],icon:'🖼️',lossless:true},
  webp:{exts:['webp'],icon:'🌐',lossless:true},
  gif:{exts:['gif'],icon:'😂',lossless:true},
  bmp:{exts:['bmp'],icon:'🎨',lossless:true},
  tiff:{exts:['tif','tiff'],icon:'📄',lossless:true}
};
const ALL_EXTS_JXL=Object.values(FORMATS_JXL).flatMap(f=>f.exts);
const ALL_EXTS_AVIF=Object.values(FORMATS_AVIF).flatMap(f=>f.exts);

const I18N={
  en:{
    title:'Static Converter',
    jxlTitle:'Static to JXL',jxlSub:'High-quality lossless conversion',jxlTech:'JPEG Reversible + Lossless',jxlTabDesc:'High-quality lossless',
    avifTitle:'Static to AVIF',avifSub:'Sticker/meme optimization',avifTech:'Quality 100 + Max Compression',avifTabDesc:'Sticker optimization',
    lFiles:'Files',lSkip:'Skip',lTool:'Tool',secTitle:'Images',refTxt:'Refresh',cvtTxt:'Convert',cvting:'Converting...',
    emptyT:'No images selected',emptyD:'Select images in Eagle',
    okAll:'Converted {n} files',okPart:'{ok} ok, {fail} failed, {skip} skipped',hint:'Click Refresh for next batch',
    noTool:'Tool not found',skipSmall:'< threshold',skipLarger:'Output larger',skipAnimated:'Animated (use FFmpeg)',
    lThreshold:'Size Filter',
    hintJpeg:'JPEG',hintJpegDesc:'Always convert (reversible)',
    hintOther:'PNG/BMP/TIFF',hintOtherDesc:'Only ≥ threshold (0=no filter)',
    hintAvif:'All formats',hintAvifDesc:'Quality 100, only ≥ threshold',
    helpTitle:'Usage Guide'
  },
  zh_CN:{
    title:'静态图转换器',
    jxlTitle:'静态图转 JXL',jxlSub:'高质量无损转换',jxlTech:'JPEG可逆 + 无损',jxlTabDesc:'高质量无损',
    avifTitle:'静态图转 AVIF',avifSub:'表情包/贴纸优化',avifTech:'质量100 + 最大压缩',avifTabDesc:'表情包优化',
    lFiles:'文件',lSkip:'跳过',lTool:'工具',secTitle:'图像',refTxt:'刷新',cvtTxt:'转换',cvting:'转换中...',
    emptyT:'未选择图像',emptyD:'在 Eagle 中选择图像',
    okAll:'已转换 {n} 个文件',okPart:'{ok} 成功，{fail} 失败，{skip} 跳过',hint:'点击刷新继续',
    noTool:'未找到工具',skipSmall:'< 阈值',skipLarger:'输出更大',skipAnimated:'动画（需用FFmpeg）',
    lThreshold:'大小过滤',
    hintJpeg:'JPEG',hintJpegDesc:'始终转换（可逆）',
    hintOther:'PNG/BMP/TIFF',hintOtherDesc:'仅 ≥ 阈值时转换（0=关闭过滤）',
    hintAvif:'所有格式',hintAvifDesc:'质量100，仅 ≥ 阈值时转换',
    helpTitle:'使用说明'
  },
  zh_TW:{
    title:'靜態圖轉換器',
    jxlTitle:'靜態圖轉 JXL',jxlSub:'高質量無損轉換',jxlTech:'JPEG可逆 + 無損',jxlTabDesc:'高質量無損',
    avifTitle:'靜態圖轉 AVIF',avifSub:'表情包/貼紙優化',avifTech:'質量100 + 最大壓縮',avifTabDesc:'表情包優化',
    lFiles:'檔案',lSkip:'跳過',lTool:'工具',secTitle:'圖像',refTxt:'重新整理',cvtTxt:'轉換',cvting:'轉換中...',
    emptyT:'未選擇圖像',emptyD:'在 Eagle 中選擇圖像',
    okAll:'已轉換 {n} 個檔案',okPart:'{ok} 成功，{fail} 失敗，{skip} 跳過',hint:'點擊重新整理繼續',
    noTool:'未找到工具',skipSmall:'< 閾值',skipLarger:'輸出更大',skipAnimated:'動畫（需用FFmpeg）',
    lThreshold:'大小過濾',
    hintJpeg:'JPEG',hintJpegDesc:'始終轉換（可逆）',
    hintOther:'PNG/BMP/TIFF',hintOtherDesc:'僅 ≥ 閾值時轉換（0=關閉過濾）',
    hintAvif:'所有格式',hintAvifDesc:'質量100，僅 ≥ 閾值時轉換',
    helpTitle:'使用說明'
  },
  ja_JP:{
    title:'静的画像コンバーター',
    jxlTitle:'静的画像 to JXL',jxlSub:'高品質ロスレス変換',jxlTech:'JPEG可逆 + ロスレス',jxlTabDesc:'高品質ロスレス',
    avifTitle:'静的画像 to AVIF',avifSub:'スタンプ/ミーム最適化',avifTech:'品質100 + 最大圧縮',avifTabDesc:'スタンプ最適化',
    lFiles:'ファイル',lSkip:'スキップ',lTool:'ツール',secTitle:'画像',refTxt:'更新',cvtTxt:'変換',cvting:'変換中...',
    emptyT:'未選択',emptyD:'Eagleで画像を選択',
    okAll:'{n}件変換完了',okPart:'{ok}成功 {fail}失敗 {skip}スキップ',hint:'更新で次へ',
    noTool:'ツール未検出',skipSmall:'< 閾値',skipLarger:'出力大きい',skipAnimated:'アニメ（FFmpeg必要）',
    lThreshold:'サイズフィルタ',
    hintJpeg:'JPEG',hintJpegDesc:'常に変換（可逆）',
    hintOther:'PNG/BMP/TIFF',hintOtherDesc:'閾値以上のみ（0=フィルタ無効）',
    hintAvif:'全フォーマット',hintAvifDesc:'品質100、閾値以上のみ',
    helpTitle:'使用ガイド'
  }
};

let locale=localStorage.getItem('cvt_locale')||'zh_CN';
let mode=localStorage.getItem('cvt_mode')||'jxl';
let files=[],tools={cjxl:null,avifenc:null,ffmpeg:null,exiftool:null},loading=false,converting=false,done=new Set();
let thresholdBytes=1.25*1024*1024;

const $=id=>document.getElementById(id);
const t=k=>I18N[locale]?.[k]||I18N.en[k]||k;
const {spawn}=require('child_process');
const fs=require('fs').promises;
const fss=require('fs');
const path=require('path');

const PLATFORM={os:process.platform,arch:process.arch,isWin:process.platform==='win32',isMac:process.platform==='darwin',isLinux:process.platform==='linux'};

function getFormatInfo(ext,forMode){
  if(!ext)return null;
  ext=ext.toLowerCase();
  const formats=forMode==='avif'?FORMATS_AVIF:FORMATS_JXL;
  for(const[k,v]of Object.entries(formats)){if(v.exts.includes(ext))return{type:k,...v};}
  return null;
}
function getAllExts(){return mode==='avif'?ALL_EXTS_AVIF:ALL_EXTS_JXL;}
function getBundledPath(name){
  const binDir=path.join(__dirname,'bin');
  if(PLATFORM.isWin)return path.join(binDir,'win32',name+'.exe');
  if(PLATFORM.isMac)return{universal:path.join(binDir,'darwin',name),archSpecific:path.join(binDir,'darwin',PLATFORM.arch,name)};
  if(PLATFORM.isLinux)return{generic:path.join(binDir,'linux',name),archSpecific:path.join(binDir,'linux',PLATFORM.arch,name)};
  return null;
}
function exec(cmd,args){
  return new Promise((res,rej)=>{
    const env={...process.env};
    if(PLATFORM.isMac){const libDir=path.join(__dirname,'bin','darwin','lib');env.DYLD_LIBRARY_PATH=(env.DYLD_LIBRARY_PATH||'')+':'+libDir;env.DYLD_FALLBACK_LIBRARY_PATH=(env.DYLD_FALLBACK_LIBRARY_PATH||'')+':'+libDir;}
    if(PLATFORM.isLinux){const libDir=path.join(__dirname,'bin','linux','lib');env.LD_LIBRARY_PATH=(env.LD_LIBRARY_PATH||'')+':'+libDir;}
    const p=spawn(cmd,args,{shell:false,env});
    let out='',err='';
    p.stdout.on('data',d=>out+=d);p.stderr.on('data',d=>err+=d);
    p.on('close',c=>c===0?res({out,err}):rej({code:c,out,err}));
    p.on('error',e=>rej({err:e.message}));
  });
}
async function findTool(name){
  const paths=getBundledPath(name);
  if(!paths)return null;
  if(typeof paths==='string'){try{await fs.access(paths,fss.constants.X_OK);return paths;}catch{}try{await fs.access(paths);return paths;}catch{}return null;}
  const candidates=[paths.universal,paths.archSpecific,paths.generic].filter(Boolean);
  for(const p of candidates){try{await fs.access(p);try{await fs.chmod(p,0o755);}catch{}return p;}catch{}}
  return null;
}
function getPlatformInfo(){return `${PLATFORM.isMac?'macOS':PLATFORM.isWin?'Windows':'Linux'} ${PLATFORM.arch}`;}
</script>

<script>
function renderSettings(){
  const isAvif=mode==='avif';
  const thVal=thresholdBytes/1024/1024;
  $('settingsPanel').innerHTML=`
    <div class="settings">
      <div class="settings-row">
        <span class="settings-label">${t('lThreshold')}</span>
        <div class="settings-input">
          <input type="number" id="thresholdVal" min="0" step="0.25" value="${thVal}">
          <select id="thresholdUnit"><option value="mb">MB</option><option value="kb">KB</option></select>
        </div>
        <span style="font-size:12px;color:var(--text-3)" id="thresholdStatus">≥${thVal.toFixed(2)}MB</span>
      </div>
      <div class="settings-hint${isAvif?' avif':''}">
        ${isAvif?`😂 ${t('hintAvif')}: ${t('hintAvifDesc')}`:`💡 ${t('hintJpeg')}: ${t('hintJpegDesc')}<br>📦 ${t('hintOther')}: ${t('hintOtherDesc')}`}
      </div>
    </div>
  `;
  const thValEl=$('thresholdVal'),thUnit=$('thresholdUnit');
  if(thValEl&&thUnit){
    const updateTh=()=>{
      const val=parseFloat(thValEl.value)||0;
      const unit=thUnit.value;
      thresholdBytes=unit==='kb'?val*1024:val*1024*1024;
      $('thresholdStatus').textContent=val===0?'(disabled)':`≥${val}${unit.toUpperCase()}`;
      localStorage.setItem('cvt_threshold',val);
      localStorage.setItem('cvt_unit',unit);
      render();
    };
    thValEl.oninput=updateTh;
    thUnit.onchange=updateTh;
  }
}

function renderStats(){
  const isAvif=mode==='avif';
  const toConvert=files.filter(f=>!shouldSkip(f).skip);
  const toSkip=files.filter(f=>shouldSkip(f).skip);
  const toolName=isAvif?(tools.avifenc?'✓ avifenc':'✗'):(tools.cjxl?'✓ cjxl':'✗');
  $('statsPanel').innerHTML=`
    <div class="stats">
      <div class="stat"><div class="stat-label">${t('lFiles')}</div><div class="stat-value${isAvif?' avif':''}">${toConvert.length}</div></div>
      <div class="stat"><div class="stat-label">${t('lSkip')}</div><div class="stat-value${isAvif?' avif':''}">${toSkip.length}</div></div>
      <div class="stat"><div class="stat-label">${t('lTool')}</div><div class="stat-value${isAvif?' avif':''}" style="font-size:11px">${toolName}</div></div>
    </div>
  `;
}

function renderFileList(){
  const isAvif=mode==='avif';
  $('fileSection').innerHTML=`
    <div class="file-section">
      <div class="section-header"><span class="section-title">${t('secTitle')}</span><span class="badge${isAvif?' avif':''}">${files.length}</span></div>
      <div class="file-list" id="fList"></div>
    </div>
  `;
  if(files.length===0){
    $('fList').innerHTML=`<div class="empty"><div class="empty-icon">🖼️</div><div class="empty-title">${t('emptyT')}</div><div class="empty-desc">${t('emptyD')}</div></div>`;
    return;
  }
  $('fList').innerHTML=files.map((f,i)=>{
    const fmt=getFormatInfo(f.ext,mode);
    const icon=fmt?fmt.icon:'📄';
    const skipInfo=shouldSkip(f);
    const sizeStr=f.size>=1024*1024?(f.size/1024/1024).toFixed(2)+'MB':(f.size/1024).toFixed(0)+'KB';
    const skipClass=skipInfo.skip?'skipped':'';
    const skipReason=skipInfo.skip?`<div class="skip-reason">⏭️ ${skipInfo.reason}</div>`:'';
    return `<div class="file-item ${skipClass}" style="animation-delay:${i*15}ms"><div class="file-icon">${icon}</div><div class="file-name">${f.name}</div><div class="file-size">${sizeStr}</div><div class="file-ext">.${f.ext}</div>${skipReason}</div>`;
  }).join('');
}

function renderFooter(){
  const isAvif=mode==='avif';
  const toConvert=files.filter(f=>!shouldSkip(f).skip);
  const tool=isAvif?tools.avifenc:tools.cjxl;
  const disabled=!tool||converting||toConvert.length===0;
  $('footerPanel').innerHTML=`
    <div class="footer">
      <div class="footer-row">
        <button class="btn-s" id="refBtn"><span>↻</span><span>${t('refTxt')}</span></button>
        <button class="btn-p${isAvif?' avif':''}" id="cvtBtn" ${disabled?'disabled':''}>${converting?t('cvting'):t('cvtTxt')}</button>
      </div>
      <div id="status"></div>
    </div>
  `;
  $('refBtn').onclick=()=>{done.clear();$('status').innerHTML='';load();};
  $('cvtBtn').onclick=run;
}

function render(){renderStats();renderFileList();renderFooter();}

function updateHeader(){
  const isAvif=mode==='avif';
  $('titleText').textContent=t('title');
  $('hTitle').textContent=isAvif?t('avifTitle'):t('jxlTitle');
  $('hSub').textContent=isAvif?t('avifSub'):t('jxlSub');
  $('techBadge').className='tech-badge'+(isAvif?' avif':'');
  $('techText').textContent=isAvif?t('avifTech'):t('jxlTech');
  $('tabJxlDesc').textContent=t('jxlTabDesc');
  $('tabAvifDesc').textContent=t('avifTabDesc');
}

function switchMode(newMode){
  mode=newMode;
  localStorage.setItem('cvt_mode',mode);
  $('tabJxl').classList.toggle('active',mode==='jxl');
  $('tabAvif').classList.toggle('active',mode==='avif');
  $('tabAvif').classList.toggle('avif',mode==='avif');
  updateHeader();
  renderSettings();
  files=[];done.clear();
  load();
}

function shouldSkip(f){
  if(!f||!f.ext)return{skip:true,reason:'invalid'};
  const fmt=getFormatInfo(f.ext,mode);
  if(!fmt)return{skip:true,reason:'unsupported'};
  
  if(mode==='jxl'){
    // JXL: JPEG永远不跳过，其他检查阈值
    if(fmt.type==='jpeg')return{skip:false};
    if(thresholdBytes===0)return{skip:false};
    if(fmt.lossless&&f.size<thresholdBytes)return{skip:true,reason:t('skipSmall')};
    return{skip:false};
  }else{
    // AVIF: 所有格式都检查阈值
    if(thresholdBytes===0)return{skip:false};
    if(f.size<thresholdBytes)return{skip:true,reason:t('skipSmall')};
    // 动画GIF需要FFmpeg
    if(fmt.type==='gif'&&f.isAnimated&&!tools.ffmpeg)return{skip:true,reason:t('skipAnimated')};
    return{skip:false};
  }
}
</script>

<script>
async function load(){
  if(loading||!window.eagle?.item)return;
  loading=true;if($('refBtn'))$('refBtn').disabled=true;
  log.i(K.FILE,'Loading...',{mode});
  try{
    const items=await eagle.item.getSelected();
    const exts=getAllExts();
    const supported=(items||[]).filter(i=>i&&i.ext&&exts.includes(i.ext.toLowerCase()));
    files=supported.filter(f=>!done.has(f.id)).map(f=>{
      let fileName=f.name;
      if(!fileName&&f.filePath){const base=f.filePath.split('/').pop().split('\\').pop();fileName=base.split('.').slice(0,-1).join('.')||base;}
      return{id:f.id,name:fileName||'unknown',ext:(f.ext||'').toLowerCase(),filePath:f.filePath,size:(f.filePath&&fss.existsSync(f.filePath))?fss.statSync(f.filePath).size:0,isAnimated:false};
    });
    log.i(K.FILE,'Loaded',{total:supported.length,new:files.length,mode});
    render();
  }catch(e){log.e(K.FILE,'Error',{err:e.message});}
  loading=false;if($('refBtn'))$('refBtn').disabled=false;
}

async function convertJxl(f){
  const inp=f.filePath,out=inp.replace(/\.[^.]+$/,'.jxl');
  const fmt=getFormatInfo(f.ext,'jxl'),isJpeg=fmt.type==='jpeg';
  try{await fs.access(inp);}catch{throw new Error('ENOENT');}
  log.i(K.CVT,'JXL Start',{name:f.name,type:fmt.type,isJpeg});
  const args=isJpeg?[inp,out,'--lossless_jpeg=1','-e','7']:[inp,out,'-d','0','-e','7'];
  await exec(tools.cjxl,args);
  try{await fs.access(out);}catch{throw new Error('Output not created');}
  const inSize=f.size,outSize=(await fs.stat(out)).size;
  if(outSize>inSize){log.w(K.CVT,'JXL larger, rollback',{name:f.name});await fs.unlink(out);return{skipped:true,reason:t('skipLarger')};}
  if(tools.exiftool){try{await exec(tools.exiftool,['-tagsFromFile',inp,'-all:all','-icc_profile','-overwrite_original',out]);}catch{}}
  try{const st=await fs.stat(inp);await fs.utimes(out,st.atime,st.mtime);}catch{}
  try{await fs.unlink(inp);}catch{}
  try{const dir=path.dirname(inp);if(dir.endsWith('.info')){const mp=path.join(dir,'metadata.json');const m=JSON.parse(await fs.readFile(mp,'utf8'));m.ext='jxl';m.modificationTime=Date.now();await fs.writeFile(mp,JSON.stringify(m,null,2));}}catch{}
  done.add(f.id);
  log.i(K.CVT,'JXL Done',{name:f.name,reduction:((1-outSize/inSize)*100).toFixed(1)+'%'});
  return{skipped:false};
}

async function convertAvif(f){
  const inp=f.filePath,out=inp.replace(/\.[^.]+$/,'.avif');
  const fmt=getFormatInfo(f.ext,'avif');
  try{await fs.access(inp);}catch{throw new Error('ENOENT');}
  log.i(K.CVT,'AVIF Start',{name:f.name,type:fmt.type});
  // 固定 quality=100
  if(f.isAnimated&&tools.ffmpeg){
    const args=['-i',inp,'-c:v','libaom-av1','-crf','0','-cpu-used','6','-y',out];
    await exec(tools.ffmpeg,args);
  }else{
    const args=['-q','100','--speed','6',inp,out];
    await exec(tools.avifenc,args);
  }
  try{await fs.access(out);}catch{throw new Error('Output not created');}
  const inSize=f.size,outSize=(await fs.stat(out)).size;
  if(outSize>inSize){log.w(K.CVT,'AVIF larger, rollback',{name:f.name});await fs.unlink(out);return{skipped:true,reason:t('skipLarger')};}
  if(tools.exiftool){try{await exec(tools.exiftool,['-tagsFromFile',inp,'-all:all','-icc_profile','-overwrite_original',out]);}catch{}}
  try{const st=await fs.stat(inp);await fs.utimes(out,st.atime,st.mtime);}catch{}
  try{await fs.unlink(inp);}catch{}
  try{const dir=path.dirname(inp);if(dir.endsWith('.info')){const mp=path.join(dir,'metadata.json');const m=JSON.parse(await fs.readFile(mp,'utf8'));m.ext='avif';m.modificationTime=Date.now();await fs.writeFile(mp,JSON.stringify(m,null,2));}}catch{}
  done.add(f.id);
  log.i(K.CVT,'AVIF Done',{name:f.name,reduction:((1-outSize/inSize)*100).toFixed(1)+'%'});
  return{skipped:false};
}

async function run(){
  const toConvert=files.filter(f=>!shouldSkip(f).skip);
  const tool=mode==='avif'?tools.avifenc:tools.cjxl;
  if(!toConvert.length||!tool||converting)return;
  converting=true;
  const btn=$('cvtBtn');
  btn.disabled=true;btn.classList.add('loading');btn.textContent=t('cvting');
  $('status').innerHTML=`<div class="progress"><div class="progress-bar${mode==='avif'?' avif':''}" id="pBar"></div></div>`;
  log.i(K.CVT,'=== Batch start ===',{total:toConvert.length,mode});
  let ok=0,fail=0,skip=0;
  for(let i=0;i<toConvert.length;i++){
    try{
      const result=mode==='avif'?await convertAvif(toConvert[i]):await convertJxl(toConvert[i]);
      if(result.skipped){skip++;}else{ok++;}
    }catch(e){fail++;log.e(K.CVT,'Failed',{name:toConvert[i].name,err:e.message||e.err});}
    $('pBar').style.width=((i+1)/toConvert.length*100)+'%';
  }
  log.i(K.CVT,'=== Batch done ===',{ok,fail,skip});
  btn.classList.remove('loading');
  const st=$('status');
  if(fail===0&&skip===0){st.innerHTML=`<div class="status status-ok">${t('okAll').replace('{n}',ok)}<br><small style="opacity:.7">${t('hint')}</small></div>`;}
  else{st.innerHTML=`<div class="status status-warn">${t('okPart').replace('{ok}',ok).replace('{fail}',fail).replace('{skip}',skip)}</div>`;}
  converting=false;btn.textContent=t('cvtTxt');files=[];render();
}

function showHelp(){
  $('helpModal').classList.add('show');
  const isAvif=mode==='avif';
  $('modalContent').innerHTML=`
    <div class="modal-header"><div class="modal-title"><span>📖</span><span>${t('helpTitle')}</span></div><button class="modal-close" id="modalClose">×</button></div>
    <div class="modal-body">
      ${isAvif?`
        <div class="help-section"><div class="help-title avif">😂 AVIF 表情包模式</div><div class="help-content">使用 <code>avifenc -q 100</code> 高质量压缩。<br>✅ 85% 浏览器支持<br>✅ 比 GIF 小 50-70%<br>✅ 支持透明度</div></div>
        <div class="help-section"><div class="help-title avif">⚙️ 大小过滤</div><div class="help-content">仅转换 ≥ 阈值的文件。<br>设为 <code>0</code> 关闭过滤。</div></div>
      `:`
        <div class="help-section"><div class="help-title">📷 JPEG</div><div class="help-content">使用 <code>--lossless_jpeg=1</code> 可逆转码。<br>✅ 无论大小始终转换<br>✅ 可完美还原为原始 JPEG</div></div>
        <div class="help-section"><div class="help-title">🖼️ PNG / BMP / TIFF</div><div class="help-content">使用 <code>-d 0</code> 数学无损。<br>⚠️ 仅当文件 ≥ 阈值时转换</div></div>
      `}
      <div class="help-tip">💡 输出更大时会自动回退，不会替换原文件</div>
    </div>
  `;
  $('modalClose').onclick=()=>$('helpModal').classList.remove('show');
}

function nextLocale(){
  const ls=['zh_CN','en','zh_TW','ja_JP'];
  locale=ls[(ls.indexOf(locale)+1)%ls.length];
  localStorage.setItem('cvt_locale',locale);
  updateHeader();renderSettings();render();
}

async function init(){
  log.i(K.INIT,'=== Static Converter v3.0 ===');
  log.i(K.INIT,'Platform: '+getPlatformInfo());
  const savedTh=localStorage.getItem('cvt_threshold');
  const savedUnit=localStorage.getItem('cvt_unit');
  if(savedTh!==null)thresholdBytes=(parseFloat(savedTh)||0)*(savedUnit==='kb'?1024:1024*1024);
  updateHeader();renderSettings();render();
  tools.cjxl=await findTool('cjxl');
  tools.avifenc=await findTool('avifenc');
  tools.ffmpeg=await findTool('ffmpeg');
  tools.exiftool=await findTool('exiftool');
  log.i(K.TOOL,'Tools',{cjxl:!!tools.cjxl,avifenc:!!tools.avifenc,ffmpeg:!!tools.ffmpeg,exiftool:!!tools.exiftool});
  const tool=mode==='avif'?tools.avifenc:tools.cjxl;
  if(!tool){$('status').innerHTML=`<div class="status status-err">${t('noTool')}<br><small>${getPlatformInfo()}</small></div>`;}
  render();
  if(!window.eagle){log.e(K.EAGLE,'No Eagle API');return;}
  eagle.onPluginCreate(()=>load());
  eagle.onPluginRun(()=>load());
  eagle.onPluginShow(()=>load());
  if(eagle.onSelectionChanged)eagle.onSelectionChanged(()=>load());
  setTimeout(load,100);
  log.i(K.INIT,'Ready');
}

$('langBtn').onclick=nextLocale;
$('helpBtn').onclick=showHelp;
$('tabJxl').onclick=()=>switchMode('jxl');
$('tabAvif').onclick=()=>switchMode('avif');
$('minBtn').onclick=()=>eagle.window.minimize();
$('maxBtn').onclick=async()=>{(await eagle.window.isMaximized())?eagle.window.unmaximize():eagle.window.maximize();};
$('closeBtn').onclick=()=>eagle.window.hide();
init();
</script>
