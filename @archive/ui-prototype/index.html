<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixly Nightly - Next Gen Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="antialiased text-gray-100">
    <div id="app" class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 glass-panel m-4 mr-0 flex flex-col">
            <div class="p-6 flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg animate-float">
                    <i data-lucide="zap" class="text-white w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl tracking-tight">Pixly</h1>
                    <span class="text-xs text-indigo-400 font-medium px-2 py-0.5 rounded-full bg-indigo-500/10 border border-indigo-500/20">Nightly</span>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-2 mt-4">
                <a href="#" @click="currentView = 'dashboard'" 
                   :class="{'bg-white/10 text-white': currentView === 'dashboard', 'text-gray-400 hover:text-white hover:bg-white/5': currentView !== 'dashboard'}"
                   class="flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 group">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                    <span class="font-medium">Dashboard</span>
                </a>
                
                <a href="#" @click="currentView = 'optimizer'"
                   :class="{'bg-white/10 text-white': currentView === 'optimizer', 'text-gray-400 hover:text-white hover:bg-white/5': currentView !== 'optimizer'}"
                   class="flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 group">
                    <i data-lucide="image" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                    <span class="font-medium">Image Optimizer</span>
                </a>

                <a href="#" @click="currentView = 'batch'"
                   :class="{'bg-white/10 text-white': currentView === 'batch', 'text-gray-400 hover:text-white hover:bg-white/5': currentView !== 'batch'}"
                   class="flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 group">
                    <i data-lucide="layers" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                    <span class="font-medium">Batch Converter</span>
                </a>

                <a href="#" @click="currentView = 'settings'"
                   :class="{'bg-white/10 text-white': currentView === 'settings', 'text-gray-400 hover:text-white hover:bg-white/5': currentView !== 'settings'}"
                   class="flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 group">
                    <i data-lucide="settings" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                    <span class="font-medium">Settings</span>
                </a>
            </nav>

            <div class="p-4 mt-auto">
                <div class="glass-panel p-4 bg-gradient-to-br from-indigo-900/50 to-purple-900/50 border-indigo-500/30">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-semibold text-indigo-300">SYSTEM STATUS</span>
                        <span class="status-dot status-active"></span>
                    </div>
                    <div class="text-xs text-gray-400 space-y-1">
                        <div class="flex justify-between">
                            <span>CPU Usage</span>
                            <span class="text-white">12%</span>
                        </div>
                        <div class="w-full bg-gray-700/50 rounded-full h-1.5 mt-1">
                            <div class="bg-indigo-500 h-1.5 rounded-full" style="width: 12%"></div>
                        </div>
                        <div class="flex justify-between mt-2">
                            <span>Memory</span>
                            <span class="text-white">1.2GB</span>
                        </div>
                        <div class="w-full bg-gray-700/50 rounded-full h-1.5 mt-1">
                            <div class="bg-purple-500 h-1.5 rounded-full" style="width: 45%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 overflow-y-auto">
            <header class="flex justify-between items-center mb-8 px-2">
                <div>
                    <h2 class="text-2xl font-bold text-white">{{ pageTitle }}</h2>
                    <p class="text-gray-400 text-sm mt-1">AI-Powered Media Processing Engine</p>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="p-2 rounded-full hover:bg-white/10 transition-colors relative">
                        <i data-lucide="bell" class="w-5 h-5 text-gray-300"></i>
                        <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-[#0f172a]"></span>
                    </button>
                    <div class="flex items-center space-x-3 glass-panel px-3 py-1.5">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Pixly" alt="User" class="w-8 h-8 rounded-full bg-indigo-500/20">
                        <span class="text-sm font-medium">Admin User</span>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
                    </div>
                </div>
            </header>

            <!-- Dynamic Component View -->
            <transition name="fade" mode="out-in">
                <component :is="currentViewComponent"></component>
            </transition>
        </main>
    </div>

    <!-- Scripts -->
    <script src="components/Dashboard.js"></script>
    <script src="components/ImageOptimizer.js"></script>
    <script src="components/BatchConverter.js"></script>
    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
