<div class="main-panel">
            <!-- 顶部控制栏：转换类型 + 快捷工具 -->
            <div class="section">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start;">
                    <!-- 左侧：转换类型选择器 -->
                    <div>
                        <h3 style="margin-bottom: 12px;" data-i18n="conversion.title">🎨 Conversion Type</h3>
                        <div class="conversion-type-selector">
                            <button class="type-tab active" data-type="image" data-i18n="conversion.image;[title]conversion.imageTooltip">
                                📷 Image Conversion
                            </button>
                            <button class="type-tab" data-type="video" data-i18n="conversion.video;[title]conversion.videoTooltip">
                                🎬 Video Processing
                            </button>
                        </div>
                    </div>

                    <!-- 右侧：快捷工具 -->
                    <div id="topQuickTools">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                            <h3 style="margin: 0;" data-i18n="tools.title">🛠️ Quick Tools</h3>
                            <div id="autoProcessingHints" style="font-size: 10px; color: var(--text-muted); display: flex; gap: 8px; align-items: center;">
                                <!-- 🆕 8层验证器提示（动态位置） -->
                                <span id="validationHint" class="tooltip-trigger" title="所有输入输出经过多层验证机制：格式检测、完整性检查、尺寸验证、质量评估、防作弊验证等，确保可靠性和可信度" style="cursor: help; position: relative; color: #06b6d4; font-weight: 600; order: 1;">🔒 8层验证</span>
                                <span id="validationSeparator" style="color: var(--text-muted); order: 2;">•</span>
                                <span id="xmpAutoMergeHint" class="tooltip-trigger" data-i18n="tools.xmpAutoMergeHint;[data-tooltip]tools.xmpAutoMergeTooltip" style="cursor: help; position: relative; display: none; color: #4CAF50; font-weight: 600; order: 3;">💡 XMP自动合并</span>
                                <span id="hintSeparator" style="display: none; order: 4;">•</span>
                                <span class="tooltip-trigger" data-i18n="tools.autoNormalizeHint;[data-tooltip]tools.autoNormalizeTooltip" style="cursor: help; position: relative; order: 5;">📝 Filename Auto-Normalization</span>
                                    </div>
                                </div>
                        <div class="quick-tools-grid">
                            <!-- 🔥 Phase 46.3: AI File Validation（实验性） -->
                            <label class="quick-tool-option" style="position: relative;" data-i18n="[title]tools.fileValidationTooltip">
                                <input type="checkbox" id="enableFileValidationQuick" checked>
                                <div class="quick-tool-content">
                                    <div class="quick-tool-icon">🔒</div>
                                    <div class="quick-tool-info">
                                        <div class="quick-tool-name" style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap;">
                                            <span data-i18n="tools.fileValidation" style="white-space: nowrap;">AI File Validation</span>
                                            <span style="font-size: 8px; font-weight: 700; padding: 1px 4px; border-radius: 2px; background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%); color: white; letter-spacing: 0.3px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); flex-shrink: 0;" data-i18n="common.experimental">Experimental</span>
                                        </div>
                                        <div class="quick-tool-desc" data-i18n="tools.fileValidationDesc">Magika AI Detection</div>
                                    </div>
                                </div>
                            </label>

                            <!-- 🔥 Phase 46.3: 自动修正格式（实验性） -->
                            <label class="quick-tool-option" style="position: relative;" data-i18n="[title]tools.formatCorrectionTooltip">
                                <input type="checkbox" id="enableFormatCorrectionQuick" checked>
                                <div class="quick-tool-content">
                                    <div class="quick-tool-icon">🔧</div>
                                    <div class="quick-tool-info">
                                        <div class="quick-tool-name" style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap;">
                                            <span data-i18n="tools.formatCorrection" style="white-space: nowrap;">Format Correction</span>
                                            <span style="font-size: 8px; font-weight: 700; padding: 1px 4px; border-radius: 2px; background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%); color: white; letter-spacing: 0.3px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); flex-shrink: 0;" data-i18n="common.experimental">Experimental</span>
                                        </div>
                                        <div class="quick-tool-desc" data-i18n="tools.formatCorrectionDesc">AI Detect & Fix</div>
                                    </div>
                                </div>
                            </label>
                            
                            <!-- 🔥 Phase 46.3: 一键修复 -->
                            <button class="quick-tool-option quick-tool-button" id="quickFixBtn" onclick="runQuickFix()" style="border: 2px solid #3b82f6; background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);">
                                <div class="quick-tool-content">
                                    <div class="quick-tool-icon">🔧</div>
                                    <div class="quick-tool-info">
                                        <div class="quick-tool-name" data-i18n="tools.quickFix">Quick Fix</div>
                                        <div class="quick-tool-desc" data-i18n="tools.quickFixDesc">Fix Anomalies</div>
                                    </div>
                                </div>
                            </button>

                            <!-- 🔥 Phase 46.3: Format Correction已改为 AI 高级选项中的多选框 -->
                            <!-- 旧的快捷工具按钮已移除，功能现在自动化执行 -->
                    </div>
                                </div>
                                </div>
                            </div>

            <!-- ========== 图像转换面板（现有功能） ========== -->
            <div id="imageConversionPanel" class="conversion-panel">
                <!-- 🎨 Phase 41: 模板容器（动态加载） -->
                <div id="image-panel-container"></div>
            </div>
            <!-- ========== 图像转换面板结束 ========== -->

            <!-- ========== 动图→视频转换面板 ========== -->
            <!-- ========== 🎬 统一视频处理面板 ========== -->
            <div id="videoPanel" class="conversion-panel" style="display: none;">
                <!-- 🎨 Phase 41: 模板容器（动态加载） -->
                <div id="video-panel-container"></div>
            </div>
            <!-- ========== 🎬 统一视频处理面板结束 ========== -->
        </div>

        <!-- 结果显示 -->
