        <header class="header-integrated">
            <!-- 左侧：Logo + 标题 -->
            <div class="header-left">
                <img src="logo.png" alt="PIXLY Logo" class="header-logo">
                <div class="header-title-group">
                    <h1 class="header-title" data-i18n="app.title">PIXLY Image Converter</h1>
                    <p class="header-subtitle" data-i18n="app.subtitle">AI-Powered · GPU Accelerated · Smart Optimization</p>
                </div>
            </div>
            
            <!-- 右侧：功能说明卡片 -->
            <div class="header-right">
                <div id="headerFeatures" class="header-features" style="cursor: pointer;" data-i18n="[title]header.clickForFeatures">
                    <div class="header-feature">
                        <span class="header-feature-icon">🧠</span>
                        <span class="header-feature-text" data-i18n="header.feature.ml">ML Smart Prediction</span>
                    </div>
                    <div class="header-feature">
                        <span class="header-feature-icon">⚡</span>
                        <span class="header-feature-text" data-i18n="header.feature.gpu">GPU Accelerated 7x</span>
                    </div>
                    <div class="header-feature">
                        <span class="header-feature-icon">🎯</span>
                        <span class="header-feature-text" data-i18n="header.feature.ssim">SSIM Optimization</span>
                    </div>
                    <div class="header-feature">
                        <span class="header-feature-icon">🔗</span>
                        <span class="header-feature-text" data-i18n="header.feature.preprocess">Auto Preprocessing</span>
                    </div>
                </div>
                                <div class="header-formats" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <span class="header-format jxl" data-i18n="[title]format.jxl.tooltip">JXL</span>
                    <span class="header-format avif" data-i18n="[title]format.avif.tooltip">AVIF</span>
                    <span class="header-format heic" data-i18n="[title]format.heic.tooltip">HEIC</span>
                    <span style="width: 1px; height: 16px; background: rgba(255,255,255,0.2); margin: 0 4px;"></span>
                    <!-- 🔥 日志级别选择器 -->
                    <select id="logLevelSelect" style="padding: 4px 8px; background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.25); border-radius: 4px; cursor: pointer; font-size: 11px; color: var(--text-primary); transition: all 0.2s; width: 90px;" data-i18n="[title]log.levelSelector">
                        <option value="0">ERROR</option>
                        <option value="1">WARN</option>
                        <option value="2" selected>INFO</option>
                        <option value="3">DEBUG</option>
                        <option value="4">TRACE</option>
                    </select>
                    <span style="width: 1px; height: 16px; background: rgba(255,255,255,0.2); margin: 0 4px;"></span>
                    <!-- 🔥 紧凑语言选择器 -->
                    <select id="languageSelect" style="padding: 4px 8px; background: rgba(156, 39, 176, 0.12); border: 1px solid rgba(156, 39, 176, 0.25); border-radius: 4px; cursor: pointer; font-size: 11px; color: var(--text-primary); transition: all 0.2s; width: 100px;" data-i18n="[title]language.switchLanguage">
                        <option value="en">EN</option>
                        <option value="zh_CN" data-i18n="language.zhCN">ZH-CN</option>
                        <option value="zh_TW" data-i18n="language.zhTW">ZH-TW</option>
                        <option value="ja_JP">JP</option>
                    </select>
                    <span style="width: 1px; height: 16px; background: rgba(255,255,255,0.2); margin: 0 4px;"></span>
                    <!-- 🌓 主题切换按钮 -->
                    <button id="themeToggle" style="padding: 6px 12px; background: rgba(255, 193, 7, 0.12); border: 1px solid rgba(255, 193, 7, 0.25); border-radius: 4px; cursor: pointer; font-size: 14px; transition: all 0.2s; display: flex; align-items: center; gap: 4px; color: var(--text-primary);" data-i18n="[title]theme.switchTheme" title="Switch Theme">
                        ☀️
                    </button>
                </div>
            </div>
        </header>
