<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title data-i18n="app.title">PIXLY AI - 智能多媒体处理</title>
    <link rel="stylesheet" href="css/ai-styles.css">
    <link rel="stylesheet" href="css/tooltip.css">
</head>
<body>
    <div class="container">
        <!-- 简洁Header -->
        <header class="ai-header">
            <div class="header-left">
                <img src="logo.png" alt="PIXLY AI" class="header-logo">
                <div class="header-title-group">
                    <h1 class="header-title" data-i18n="app.title">🤖 PIXLY AI</h1>
                    <p class="header-subtitle" data-i18n="app.subtitle">智能多媒体处理 · 一键优化</p>
                </div>
            </div>
            <div class="header-right">
                <button id="refreshFilesBtn" class="refresh-btn" data-i18n="[title]files.refresh" onclick="window.loadFilesFromEagle && window.loadFilesFromEagle()">
                    <span>🔄</span>
                </button>
                <select id="languageSelect" class="language-select" data-i18n="[title]language.switchLanguage">
                    <option value="zh_CN">简中</option>
                    <option value="en">EN</option>
                </select>
                <button id="themeToggle" class="theme-toggle" data-i18n="[title]theme.toggle">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </header>

        <!-- 空状态（全屏居中） -->
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📁</div>
            <h3 data-i18n="empty.title">未选择文件</h3>
            <p data-i18n="empty.desc">在 Eagle 中选择图片或视频，然后返回此插件</p>
            <div class="empty-steps">
                <div class="step">
                    <span class="step-number">1</span>
                    <span data-i18n="empty.step1">在 Eagle 选择文件</span>
                </div>
                <div class="step">
                    <span class="step-number">2</span>
                    <span data-i18n="empty.step2">返回插件</span>
                </div>
                <div class="step">
                    <span class="step-number">3</span>
                    <span data-i18n="empty.step3">一键转换</span>
                </div>
            </div>
        </div>

        <!-- 主内容区域（宽布局：左右两列） -->
        <div class="main-grid" id="mainGrid" style="display: none;">
            <!-- 左列：AI智能选项 -->
            <div class="left-column">
                <div class="panel ai-options-panel">
                    <h3 class="panel-title">
                        <span>🤖</span>
                        <span data-i18n="ai.title">AI 智能选项</span>
                    </h3>
                    
                    <!-- 优化目标 -->
                    <div class="option-group">
                        <label class="option-label" data-i18n="ai.optimizeTarget">优化目标</label>
                        <div class="preset-buttons">
                            <label class="preset-btn active">
                                <input type="radio" name="aiPreset" value="balanced" checked>
                                <span class="preset-icon">⚖️</span>
                                <span class="preset-name" data-i18n="ai.balanced">平衡</span>
                                <span class="preset-desc" data-i18n="ai.balancedDesc">质量与体积兼顾</span>
                            </label>
                            <label class="preset-btn">
                                <input type="radio" name="aiPreset" value="quality">
                                <span class="preset-icon">💎</span>
                                <span class="preset-name" data-i18n="ai.quality">质量优先</span>
                                <span class="preset-desc" data-i18n="ai.qualityDesc">最佳画质</span>
                            </label>
                            <label class="preset-btn">
                                <input type="radio" name="aiPreset" value="size">
                                <span class="preset-icon">📦</span>
                                <span class="preset-name" data-i18n="ai.size">体积优先</span>
                                <span class="preset-desc" data-i18n="ai.sizeDesc">最小文件</span>
                            </label>
                        </div>
                    </div>

                    <!-- AI功能开关 -->
                    <div class="option-group">
                        <label class="option-label" data-i18n="ai.features">AI 功能</label>
                        <div class="feature-toggles">
                            <label class="feature-toggle" data-i18n="[title]ai.smartQualityTooltip">
                                <input type="checkbox" id="smartQuality" checked>
                                <span class="toggle-icon">🎯</span>
                                <span class="toggle-text" data-i18n="ai.smartQuality">智能质量预测</span>
                            </label>
                            <label class="feature-toggle" data-i18n="[title]ai.formatRecommendTooltip">
                                <input type="checkbox" id="formatRecommend" checked>
                                <span class="toggle-icon">🎨</span>
                                <span class="toggle-text" data-i18n="ai.formatRecommend">格式智能推荐</span>
                            </label>
                            <label class="feature-toggle" data-i18n="[title]ai.ssimValidationTooltip">
                                <input type="checkbox" id="ssimValidation" checked>
                                <span class="toggle-icon">🔬</span>
                                <span class="toggle-text" data-i18n="ai.ssimValidation">SSIM 质量验证</span>
                            </label>
                            <label class="feature-toggle" data-i18n="[title]ai.videoForAnimationTooltip">
                                <input type="checkbox" id="videoForAnimation">
                                <span class="toggle-icon">🎬</span>
                                <span class="toggle-text" data-i18n="ai.videoForAnimation">动图转视频</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右列：文件列表 + 转换按钮 -->
            <div class="right-column">
                <div class="panel files-panel">
                    <div class="files-header">
                        <div class="files-info">
                            <span class="files-count" id="filesCount">0</span>
                            <span data-i18n="files.selected">个文件已选择</span>
                        </div>
                        <button class="btn-clear" id="clearFilesBtn" data-i18n="[title]files.clear">
                            <span>🗑️</span>
                        </button>
                    </div>
                    <div class="files-list" id="filesList"></div>
                </div>

                <!-- 转换按钮 -->
                <button id="convertBtn" class="btn-convert" disabled>
                    <span class="btn-icon">🚀</span>
                    <span class="btn-text" data-i18n="conversion.start">开始智能转换</span>
                </button>
            </div>
        </div>

        <!-- 进度显示 -->
        <div id="progressPanel" class="progress-panel" style="display: none;">
            <div class="progress-header">
                <span data-i18n="progress.converting">转换中...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-info" id="progressInfo"></div>
        </div>

        <!-- 结果显示 -->
        <div id="resultPanel" class="result-panel" style="display: none;">
            <div class="result-header">
                <span class="result-icon">✅</span>
                <span data-i18n="result.complete">转换完成</span>
            </div>
            <div class="result-stats" id="resultStats"></div>
            <button class="btn-open-folder" id="openFolderBtn">
                <span>📂</span>
                <span data-i18n="result.openFolder">打开输出文件夹</span>
            </button>
        </div>
    </div>

    <!-- 日志系统 -->
    <script src="js/log-constants.js"></script>
    <script src="js/logger.js"></script>
    <!-- 国际化系统 -->
    <script src="js/i18n.js"></script>
    <!-- AI 核心脚本 -->
    <script src="js/ai-core.js"></script>
</body>
</html>
